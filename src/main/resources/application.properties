spring.application.name=cadastro-pet
server.port=8080

# Origem do front. Só ela pode chamar a API pelo navegador (CORS).
app.cors.allowed-origin=http://localhost:5500

# Banco: vem SEMPRE de variável de ambiente (ver .env.example). Nada de senha aqui.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA só confere se as tabelas batem com as entidades. Quem cria as tabelas é o database/schema.sql.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
